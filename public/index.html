<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>M3U Editor Pro</title>
<style>
body{
  font-family: Arial, sans-serif;
  background:#111;
  color:white;
  padding:20px;
}
h1{color:#00ffcc}
textarea{
  width:100%;
  height:200px;
  background:#222;
  color:white;
  border:1px solid #444;
  padding:10px;
}
button{
  padding:10px 15px;
  margin:5px 5px 5px 0;
  border:none;
  cursor:pointer;
  font-weight:bold;
}
.primary{background:#00ffcc;color:black}
.danger{background:#ff3c3c;color:white}
.ok{background:#2ecc71;color:black}
input{
  padding:8px;
  width:60%;
}
.channel{
  padding:6px;
  margin:4px 0;
  border-radius:5px;
}
.ok-channel{background:#1e3d2f}
.fail-channel{background:#5a1a1a;color:#ffaaaa}
</style>
</head>
<body>

<h1>M3U Editor Pro</h1>

<input type="file" id="fileInput" accept=".m3u">
<input type="text" id="urlInput" placeholder="Pegar URL de lista M3U">
<button class="primary" onclick="loadFromURL()">Cargar URL</button>

<br><br>

<textarea id="playlist" placeholder="Aquí aparecerá la lista..."></textarea>

<br>

<button class="primary" onclick="scanChannels()">Escanear</button>
<button class="danger" onclick="filterFailed()">Mostrar solo caídos</button>
<button class="ok" onclick="copyList()">Copiar Lista</button>

<h2>Resultados</h2>
<div id="results"></div>

<script>

let scanResults = [];

document.getElementById("fileInput").addEventListener("change", function(e){
  const reader = new FileReader();
  reader.onload = function(event){
    document.getElementById("playlist").value = event.target.result;
  };
  reader.readAsText(e.target.files[0]);
});

async function loadFromURL(){
  const url = document.getElementById("urlInput").value;
  if(!url) return alert("Pega una URL");

  try{
    const res = await fetch(url);
    const text = await res.text();
    document.getElementById("playlist").value = text;
  }catch{
    alert("No se pudo cargar la URL");
  }
}

async function loadFromURL(){
  const url=document.getElementById("urlInput").value;
  if(!url) return alert("Pega una URL");

  const res=await fetch("/load",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({url})
  });

  if(!res.ok){
    alert("No se pudo cargar");
    return;
  }

  const text=await res.text();
  document.getElementById("playlist").value=text;
}

async function scanChannels(){
  const text = document.getElementById("playlist").value;
  const channels = parseM3U(text);

  const response = await fetch("/scan",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({channels})
  });

  scanResults = await response.json();
  displayResults(scanResults);
}

function displayResults(results){
  const container = document.getElementById("results");
  container.innerHTML="";

  results.forEach(ch=>{
    const div = document.createElement("div");
    div.className="channel " + (ch.status==="OK"?"ok-channel":"fail-channel");
    div.innerHTML = ch.name + " - " + ch.status;
    container.appendChild(div);
  });
}

function filterFailed(){
  const failed = scanResults.filter(ch=>ch.status==="FAIL");
  displayResults(failed);
}

function copyList(){
  const text = document.getElementById("playlist");
  text.select();
  document.execCommand("copy");
  alert("Lista copiada");
}

</script>

</body>
</html>
