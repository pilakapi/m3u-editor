<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>M3U Editor & Scanner</title>
<style>
body { font-family: Arial; background:#111; color:white; padding:20px; }
textarea { width:100%; height:150px; }
button { padding:10px; margin:5px; }
table { width:100%; margin-top:20px; border-collapse:collapse; }
td,th { border:1px solid #555; padding:8px; }
.ok { color:lime; }
.fail { color:red; }
</style>
</head>
<body>

<h2>M3U Editor & Scanner</h2>

<textarea id="m3uInput" placeholder="Pega tu lista M3U aquí..."></textarea>
<br>
<input type="file" id="fileInput">
<br>
<button onclick="parseM3U()">Cargar Lista</button>
<button onclick="scanChannels()">Escanear</button>
<button onclick="downloadM3U()">Descargar Lista</button>

<table id="table">
<thead>
<tr>
<th>Nombre</th>
<th>URL</th>
<th>Estado</th>
</tr>
</thead>
<tbody></tbody>
</table>

<script>
let channels = [];

document.getElementById("fileInput").addEventListener("change", function(e){
  const file = e.target.files[0];
  const reader = new FileReader();
  reader.onload = function(event){
    document.getElementById("m3uInput").value = event.target.result;
  };
  reader.readAsText(file);
});

function parseM3U() {
  const text = document.getElementById("m3uInput").value;
  const lines = text.split("\n");

  channels = [];
  for (let i = 0; i < lines.length; i++) {
    if (lines[i].startsWith("#EXTINF")) {
      const name = lines[i].split(",")[1];
      const url = lines[i+1];
      channels.push({ name, url, status: "Sin revisar" });
    }
  }

  renderTable();
}

function renderTable() {
  const tbody = document.querySelector("#table tbody");
  tbody.innerHTML = "";

  channels.forEach((ch, index) => {
    tbody.innerHTML += `
      <tr>
        <td contenteditable oninput="editName(${index}, this.innerText)">${ch.name}</td>
        <td contenteditable oninput="editURL(${index}, this.innerText)">${ch.url}</td>
        <td class="${ch.status === 'OK' ? 'ok' : ch.status === 'FAIL' ? 'fail' : ''}">${ch.status}</td>
      </tr>
    `;
  });
}

function editName(i, value) {
  channels[i].name = value;
}

function editURL(i, value) {
  channels[i].url = value;
}

async function scanChannels() {
  const response = await fetch("/scan", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ channels })
  });

  channels = await response.json();
  renderTable();
}

function downloadM3U() {
  let content = "#EXTM3U\n";
  channels.forEach(ch => {
    content += "#EXTINF:-1," + ch.name + "\n";
    content += ch.url + "\n";
  });

  const blob = new Blob([content], { type: "text/plain" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "lista_editada.m3u";
  a.click();
}
</script>

</body>
</html>
